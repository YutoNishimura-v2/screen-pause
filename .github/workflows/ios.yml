name: iOS simulator build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app and embedded extensions
        run: >-
          xcodebuild -project ScreenPause.xcodeproj -scheme ScreenPause
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
