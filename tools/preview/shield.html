<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>制限画面のプレビュー</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --bar-bg: #f9f9fb;
      --label: #000000;
      --secondary: rgba(60, 60, 67, 0.6);
      --separator: rgba(60, 60, 67, 0.2);
      --indigo: #5856d6;
      --shield-tint: #5856d6;
      --shield-mark: #6562e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      height: 844px;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 17px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .nav-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 44px;
      padding: 0 12px;
      background: var(--bar-bg);
      border-bottom: 0.5px solid var(--separator);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--indigo);
      font-size: 17px;
    }
    .back-btn svg {
      width: 10px;
      height: 18px;
    }
    .nav-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
    }
    main {
      min-height: calc(844px - 44px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }
    .pause-icon {
      width: 64px;
      height: 64px;
      color: var(--shield-mark);
    }
    .shield-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
    }
    .shield-subtitle {
      margin: 0;
      color: var(--label);
      font-size: 17px;
    }
    .primary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--shield-tint);
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
    }
    .secondary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 8px 16px;
      color: var(--label);
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="nav-bar">
    <div class="back-btn">
      <svg viewBox="0 0 10 18" aria-hidden="true">
        <path d="M8.5 1.5L1.5 9l7 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>ひと呼吸</span>
    </div>
    <h1 class="nav-title">制限画面のプレビュー</h1>
    <div></div>
  </header>

  <main>
    <svg class="pause-icon" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="17" y="12" width="11" height="40" rx="3" fill="currentColor"></rect>
      <rect x="36" y="12" width="11" height="40" rx="3" fill="currentColor"></rect>
    </svg>
    <h2 class="shield-title">今、開きますか？</h2>
    <p class="shield-subtitle">戻ると今日の記録に1回。</p>
    <div class="primary-btn">開かずに戻る</div>
    <div class="secondary-btn">10秒の待機を始める</div>
    <p class="shield-subtitle">待機後にもう一度押すと、5分だけ開けます。</p>
  </main>
</body>
</html>
