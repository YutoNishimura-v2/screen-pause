<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>利用時間</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --bar-bg: #f9f9fb;
      --label: #000000;
      --secondary: rgba(60, 60, 67, 0.6);
      --separator: rgba(60, 60, 67, 0.2);
      --indigo: #5856d6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      min-height: 844px;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 17px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .nav-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 44px;
      padding: 0 12px;
      background: var(--bar-bg);
      border-bottom: 0.5px solid var(--separator);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--indigo);
      font-size: 17px;
    }
    .back-btn svg {
      width: 10px;
      height: 18px;
    }
    .nav-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .stop-summary {
      margin: 0;
      padding: 16px;
    }
    .report-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    .saved-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .saved-heading {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }
    .saved-value {
      font-size: 34px;
      font-weight: 600;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .disclosure {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 17px;
      color: var(--label);
    }
    .disclosure svg {
      width: 8px;
      height: 13px;
      color: var(--indigo);
    }
  </style>
</head>
<body>
  <header class="nav-bar">
    <div class="back-btn">
      <svg viewBox="0 0 10 18" aria-hidden="true">
        <path d="M8.5 1.5L1.5 9l7 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>ひと呼吸</span>
    </div>
    <h1 class="nav-title">利用時間</h1>
    <div></div>
  </header>

  <main class="content">
    <p class="stop-summary">今日、開かずに戻れた回数は0回です。</p>
    <div class="report-body">
      <section class="saved-block">
        <h2 class="saved-heading">今週へらせた時間</h2>
        <div class="saved-value">48分</div>
      </section>
      <div class="disclosure">
        <span>利用時間の内訳</span>
        <svg viewBox="0 0 8 14" aria-hidden="true">
          <path d="M1.2 1.2L6.8 7l-5.6 5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
